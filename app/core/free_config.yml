rag-agentic-config:
  name: "rag-agentic"
  version: "1.0.1"
  prompt_version: "1.0.1"
  default_top_k: 5
  default_rerank_top_k: 5
  enable_caching: true
  log_level: "INFO"
  # Boucle agentic
  max_search_attempts: 2        # recherches max (1 = pas de nouvel essai)
  max_generation_attempts: 2    # rédactions max (1 = pas de révision)
  grading_excerpt_chars: 800    # taille des extraits montrés à l'évaluateur
  verification_excerpt_chars: 2000  # taille des sources montrées au vérificateur