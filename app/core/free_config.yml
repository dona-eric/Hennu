embedder:
  name: "sentence-transformers"
  params:
    model_name: "BAAI/bge-m3"
    dimension_embedding: 1024
    normalize_embedding: true
    device: "cpu"

vector_store:
  name: "qdrant"
  params:
    collection_name: "douane"
    embedding_dimension: 1024
    url_qdrant: "https://39a12a7c-bbbd-4f34-b9b8-1712e83f723a.us-west-1-0.aws.cloud.qdrant.io"
    api_key: "${QDRANT_API_KEY}"

# Configuration des LLM
llm:
  provider_first:
    name: "gemini"
    params:
      model_name: "gemini-3.8-flash"            # rédaction de la réponse
      fast_model_name: "gemini-3.8-flash-lite"  # reformulation de la question
      temperature: 0.2
      top_p: 0.95
      max_tokens: 2048
      api_key: "${GEMINI_API_KEY}"

  provider_second:
    name: "openai"
    params:
      model_name: "gpt-4o"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 2048
      api_key: "${OPENAI_API_KEY}"

reranker:
  first_reranker:
    name: "cross-encoder"
    params:
      model_name: "BAAI/bge-reranker-v2-m3"
      device: "cpu"
      top_n: 5

  second_reranker:
    name: "reranker-encoder"
    params:
      model_name: "BAAI/bge-reranker-base"
      device: "cpu"
      top_n: 5

retriever:
  name: "vector_retriever"
  params:
    search_type: "mmr"
    score_threshold: 0.5
    similarity_top_k: 20

models:
  - id: "gemini-3.8-flash"
    label: "Gemini 3.8 Flash"
    provider: "gemini"
    default: true
  - id: "gemini-3.8-flash-lite"
    label: "Gemini 3.8 Flash-Lite"
    provider: "gemini"
    default: false
  - id: "google/gemma-4-26b-a4b-it:free"
    label: "Gemma4-26B"
    provider: "openrouter"
    default: false

rag-agentic-config:
  name: "rag-agentic"
  version: "1.0.1"
  prompt_version: "1.0.1"
  default_top_k: 5
  default_rerank_top_k: 5
  enable_caching: true
  log_level: "INFO"