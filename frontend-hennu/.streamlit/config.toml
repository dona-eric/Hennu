# Thème clair imposé : l'interface est conçue pour un fond clair.
# (Utilisé quand Streamlit est lancé depuis le dossier frontend-hennu.)

[theme]
base = "light"
primaryColor = "#0B4F3C"
backgroundColor = "#F7F5EF"
secondaryBackgroundColor = "#EFE9DA"
textColor = "#1F2A24"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
