[project]
name = "hennu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dona-eric", email = "donaerickoulodji@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datalab-python-sdk>=0.7.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "huggingface>=0.0.1",
    "langgraph>=1.2.17",
    "llama-index>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-openai-like>=0.8.0",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "pinecone-client>=6.0.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "sympy>=1.14.0",
    "transformers>=5.21.0",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }


[project.scripts]
parse = "app.services.processing.parser:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
